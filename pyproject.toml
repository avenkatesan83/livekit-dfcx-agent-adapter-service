[project]
name = "dfcx-agent-adapter"
version = "0.1.0"
description = "A2A adapter for Dialogflow CX IT Service Desk requests"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "google-cloud-dialogflow-cx>=1.23",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uvicorn]
factory = false
